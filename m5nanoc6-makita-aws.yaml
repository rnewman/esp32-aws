# Makita AWS (WUT01) receiver on an M5Stack NanoC6. See aws-common.yaml.
#
# LED:  off = no tool seen
#       red = WUT01 seen (tool powered, idle)
#       green = trigger pulled
#       blue pulse = pairing mode    orange pulse = unpair mode
#       white blink = a tool was just paired/unpaired
#       while holding the button: blue (2 s), orange (5 s), bright red (10 s)

substitutions:
  name: m5nanoc6-makita-aws
  friendly_name: Makita AWS receiver
  short_friendly_name: AWS rx
  # Relay signal pin. On the NanoC6 the Grove port is GPIO1/GPIO2 (check which wire your relay unit uses).
  relay_pin: GPIO2

packages:
  aws: !include aws-common.yaml

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-c6-devkitc-1
  flash_size: 4MB
  framework:
    type: esp-idf

logger:
  level: DEBUG
  logs:
    esp32_ble_tracker: INFO
    light: INFO
    binary_sensor: INFO
    sensor: INFO
    text_sensor: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${short_friendly_name} fallback hotspot"
    password: !secret wifi_ap_password

captive_portal:

binary_sensor:
  - platform: status
    name: Online

  - platform: gpio
    id: user_button
    name: Button
    entity_category: diagnostic
    pin:
      number: GPIO9
      inverted: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_off: 10ms
    on_press:
      - script.execute: aws_button_pressed
    on_release:
      - script.execute: aws_button_released

switch:
  - platform: gpio
    id: extractor_relay
    name: Extractor relay
    pin: ${relay_pin}
    restore_mode: ALWAYS_OFF

  - platform: gpio
    pin: GPIO7
    name: On-board LED

button:
  - platform: restart
    name: ESP reboot
    icon: mdi:power-cycle

sensor:
  - platform: uptime
    name: Uptime
    update_interval: 600s
  - platform: internal_temperature
    name: ESP temperature
    update_interval: 600s

text_sensor:
  - platform: version
    name: Version
    hide_timestamp: true
    entity_category: diagnostic
  - platform: wifi_info
    ip_address:
      name: IP address

light:
  - platform: esp32_rmt_led_strip
    id: rgb_led
    name: Status LED
    icon: mdi:led-outline
    channel_colors: GRBW
    pin: GPIO20
    num_leds: 1
    chipset: WS2812
    restore_mode: ALWAYS_OFF
    default_transition_length: 0s
    power_supply: rgbpwr
    effects:
      - pulse:
          name: Pulse
          transition_length: 400ms
          update_interval: 400ms
      - strobe:
          name: Blink
          colors:
            - state: true
              brightness: 100%
              red: 0%
              green: 0%
              blue: 0%
              white: 100%
              duration: 150ms
            - state: false
              duration: 150ms

power_supply:
  - id: rgbpwr
    enable_on_boot: true
    pin: GPIO19
    enable_time: 10ms
    keep_on_time: 10ms

# Render led_mode. Only touch the light when the mode changes, so effects can run.
interval:
  - interval: 100ms
    then:
      - lambda: |-
          using namespace makita_aws;
          static int shown = -1;
          const int want = id(led_mode);
          if (want == shown) return;
          shown = want;

          auto *led = id(rgb_led);
          if (want == LED_OFF) {
            led->turn_off().perform();
            return;
          }
          auto call = led->turn_on();
          call.set_brightness(0.6f);
          call.set_effect("None");
          switch (want) {
            case LED_PRESENT: call.set_rgbw(1, 0, 0, 0); break;
            case LED_TRIGGER: call.set_rgbw(0, 1, 0, 0); break;
            case LED_PAIR:    call.set_rgbw(0, 0, 1, 0); call.set_effect("Pulse"); break;
            case LED_UNPAIR:  call.set_rgbw(1, 0.35, 0, 0); call.set_effect("Pulse"); break;
            case LED_BLINK:   call.set_rgbw(0, 0, 0, 1); call.set_effect("Blink"); break;
            case LED_HOLD2:   call.set_rgbw(0, 0, 1, 0); break;
            case LED_HOLD5:   call.set_rgbw(1, 0.35, 0, 0); break;
            case LED_HOLD10:  call.set_rgbw(1, 0, 0, 0); call.set_brightness(1.0f); break;
          }
          call.perform();
